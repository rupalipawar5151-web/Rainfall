<!DOCTYPE html>
<html lang="en">

<head>
    <title>Rainfall Register</title>


<style>
    * {
        box-sizing: border-box;

    }

    body {

        font-family: Arial, Helvetica, sans-serif;
        background: white;
        margin: 0;
        padding: 40px 15px;
    }

    .container {

        max-width: 480px;
        margin: auto;
        padding: 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 12px;
    }

    h2 {

        text-align: center;
    }

    label {
        margin-top: 16px;
        margin-bottom: 6px;
    }

    input {

        width: 100%;
        padding: 9px;
        margin-top: 5px;
        box-sizing: border-box;

    }

    button {

        margin-top: 22px;
        padding: 12px;
        color: beige;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: lightpink;
    }
</style>

<script>
    function validateform() {
        const rainInput = document.getElementbyid("mm");
        const rain = rainInput.value;
        const error = document.getElementById("error");

        error.textContent = "";

        if (rain.trim() === "" || Number(rain) < 0) {
            error.textContent = "rainfall must be valid number 0 or more";

            rainInput.focus();
            return false;
        }

        return true;

    }
</script>
</head>

<body>

    <div class="container">
        <h2>Rainfall Register</h2>

        <form action="result.jsp" method="post" onsubmit="return validateform()">

            <label for="place">Place</label>
            <input type="text" id="place" maxlength="30" required>

            <label for="rain_date">Date</label>
            <input type="text" id="rain_date" value="rain_date" required>

            <label for="mm">Rainfall(mm)</label>
            <input type="number" id="mm" name="mm" min="0" step="any" required>


            <button type="Submit">Save Rainfall</button>

        </form>
    </div>
</body>

</html>
